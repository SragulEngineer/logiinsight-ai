<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
  <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
    <div class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🤖</span>
        <h3 class="text-md font-semibold text-slate-200">System Deep Root-Cause Engineering Diagnosis</h3>
      </div>
      <button (click)="closeModal.emit()" class="text-slate-400 hover:text-slate-100 font-bold text-lg">&times;</button>
    </div>

    <div class="p-6 overflow-y-auto space-y-4 text-sm text-slate-300 font-sans" *ngIf="insight">
      <div class="flex items-center space-x-4">
        <div class="text-xs text-slate-400">System Impact Criticality Index:</div>
        <div class="px-2.5 py-1 rounded bg-rose-500/10 text-rose-400 border border-rose-500/30 text-xs font-bold font-mono">
          {{ insight.analysis.impactScore }} / 10
        </div>
        <div class="text-xs text-slate-500 font-mono">Model Engine: {{ insight.modelUsed }}</div>
      </div>

      <div class="space-y-1.5">
        <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-400">Root-Cause Assessment</h4>
        <p class="bg-slate-950 p-3 rounded-lg border border-slate-800/60 leading-relaxed text-slate-300 font-mono text-xs">
          {{ insight.analysis.rootCause }}
        </p>
      </div>

      <div class="space-y-1.5">
        <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Actionable Remediation Blueprint</h4>
        <pre class="bg-slate-950 p-4 rounded-lg border border-slate-800 overflow-x-auto font-mono text-xs text-emerald-300 whitespace-pre-wrap leading-relaxed">
          {{ insight.analysis.suggestedFix }}
        </pre>
      </div>
    </div>
  </div>
</div>
